name: Refresh Model Catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Metadata discovery only; no paid model probes or provider API keys.
      - run: npm run refresh-catalog

      - name: Save catalog for review
        uses: actions/upload-artifact@v4
        with:
          name: model-catalog
          path: src/modelCatalog.generated.json
